<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <g transform="translate(256,256)" fill="white">
    <!-- Envelope body -->
    <rect x="-80" y="-50" width="160" height="120" rx="12" stroke="white" stroke-width="4" fill="none"/>
    <!-- Envelope flap -->
    <polyline points="-80,-50 0,10 80,-50" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Shield -->
    <path d="M0,-30 L-25,-10 L-25,15 L0,30 L25,15 L25,-10 Z" fill="white" opacity="0.3"/>
    <!-- Checkmark -->
    <polyline points="-12,0 -4,8 12,-8" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  </g>
</svg>
